
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Khushi 🌻</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 14px;
      background: #f3e7d2;
      color: #594335;
      font-family: Georgia, serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .paper {
      width: 100%;
      max-width: 560px;
      padding: 32px 25px;
      background: #fff9ed;
      border: 1px solid #d9c4a4;
      box-shadow: 5px 6px 0 #ddc9aa;
      text-align: center;
      position: relative;
    }

    .flowers { font-size: 27px; margin: 14px; }

    .eyebrow {
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(30px, 8vw, 43px);
      margin: 15px 0;
      color: #9c6254;
    }

    .subtitle { font-style: italic; line-height: 1.7; }

    .file {
      display: inline-block;
      margin: 24px 0 12px;
      padding: 8px 12px;
      border: 1px dashed #bd947d;
      font-size: 12px;
      letter-spacing: 1px;
    }

    .count {
      font-size: 42px;
      color: #b56d69;
      margin: 8px 0;
    }

    h2 { font-size: 24px; margin-top: 20px; }

    .message {
      font-size: 16px;
      line-height: 1.9;
      white-space: pre-line;
    }

    .psst {
      margin-top: 24px;
      font-style: italic;
      color: #9c6254;
    }

    .footer {
      margin-top: 32px;
      font-size: 12px;
      line-height: 1.8;
      color: #987d68;
    }

    .stamp {
      margin: 24px auto 0;
      display: inline-block;
      border: 2px solid #bd8076;
      color: #bd8076;
      padding: 8px 12px;
      transform: rotate(-5deg);
      font-size: 12px;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <main class="paper">
    <div class="eyebrow">a tiny something for someone special</div>
    <div class="flowers">🌻 ✉️ 🌻</div>

    <h1>Project Khushi</h1>
    <div class="subtitle">six days of nonsense, one very special human</div>

    <div class="file" id="file">FILE 01 · SUSPICIOUS BEGINNING</div>
    <div class="count" id="count">6</div>
    <div id="countLabel">days until Khushi day</div>

    <h2 id="heading">Khushiiii, we need to talk. 👀</h2>
    <div class="message" id="message"></div>
    <div class="psst" id="psst"></div>

    <div class="stamp">TOP SECRET ♡</div>

    <div class="footer">
      Filed with questionable levels of affection ♡<br />
      made with friendship, chaos & a sunflower 🌻
    </div>
  </main>

  <script>
    const files = [
      {
        title: "FILE 01 · SUSPICIOUS BEGINNING",
        heading: "Khushiiii, we need to talk. 👀",
        message: "No need to panic. Yet. A very official investigation has begun into the person who spends half her life in the library and somehow still has time for chaos. Your birthday is getting closer. This is your first warning. Please remain suspicious. 🌻",
        psst: "Psst… come back tomorrow. The file updates daily. 👀"
      },
      {
        title: "FILE 02 · A LITTLE APPRECIATION",
        heading: "Under investigation: your heart 🥹",
        message: "Okay, serious evidence today. You have this way of making people feel included, and I don't think you realise how much that matters. I'm genuinely glad we became friends. Consider this an official record of one very lovely thing about you. 💌",
        psst: "That's enough softness for today. Maybe. Come back tomorrow. 🌻"
      },
      {
        title: "FILE 03 · THE SLIPPER INCIDENT",
        heading: "WE NEED TO DISCUSS GARBA. 😭",
        message: "The outfit? Gorgeous. The garba vibes? Immaculate. The slippers? ICONIC. Khushi, the way you paired slippers with your garba outfit deserves its own case file. Fashion rules were questioned. Comfort won. History was made. I will never let you forget this. 🤚🏻",
        psst: "Evidence preserved forever. Don't try to deny it. 👀"
      },
      {
        title: "FILE 04 · FRIENDSHIP EVIDENCE",
        heading: "A small thing that means a lot. 🫶🏻",
        message: "Some people make a place feel a little less unfamiliar, and you've done that for me. Thank you for making me feel included and for being your chaotic, caring, funny self. I'm glad this friendship became one of my little college things to treasure. 🌻",
        psst: "One more file tomorrow. No peeking ahead. 💌"
      },
      {
        title: "FILE 05 · THE MYSTERY CLUE",
        heading: "Your birthday case has a suspect. 👀",
        message: "Clue number one: someone is planning something. Clue number two: there may be paper involved. Clue number three: you are absolutely not getting the full explanation yet. Your only job is to stay curious and continue being suspicious of me. 🕵🏻‍♀️",
        psst: "The final digital file arrives tomorrow. 🌻"
      },
      {
        title: "FILE 06 · THE NIGHT BEFORE",
        heading: "Khushiiii, TOMORROW. 🥹",
        message: "Six days of nonsense have led us here. Tomorrow is your day, and I hope it brings you so much laughter, love, good food and all the little things that make you happy. There's something waiting for you from me, and this is your last digital clue.",
        psst: "Tomorrow, no more clues. Just me, you, and a little something made with love. 💌🌻"
      }
    ];

    const today = new Date();
    const year = today.getFullYear();
    const month = today.getMonth();
    const day = today.getDate();

    const birthday = new Date(year, 9, 25);
    const daysLeft = Math.ceil(
      (new Date(year, 9, 25) - new Date(year, month, day)) /
      (1000 * 60 * 60 * 24)
    );

    const validDates = month === 9 && day >= 19 && day <= 24;
    const fileIndex = validDates ? day - 19 : -1;

    document.getElementById("count").textContent =
      Math.max(0, Math.min(6, daysLeft));

    document.getElementById("countLabel").textContent =
      day === 25 && month === 9
        ? "IT'S KHUSHI DAY!! 🎂"
        : daysLeft === 1
        ? "day until Khushi day"
        : "days until Khushi day";

    if (fileIndex >= 0) {
      const file = files[fileIndex];
      document.getElementById("file").textContent = file.title;
      document.getElementById("heading").textContent = file.heading;
      document.getElementById("message").textContent = file.message;
      document.getElementById("psst").textContent = file.psst;
    } else if (month === 9 && day === 25) {
      document.getElementById("file").textContent =
        "FINAL FILE · KHUSHI DAY 🎂";
      document.getElementById("heading").textContent =
        "Happy birthday, Khushiiii! 🌻";
      document.getElementById("message").textContent =
        "Today is all about you. I hope your day is full of love, laughter, and all the happiness you deserve. Your final surprise is not on this screen… it's something handwritten, just for you. 💌";
      document.getElementById("psst").textContent =
        "Go find your letter. Happy Khushi day! 🫶🏻";
    } else if (month > 9 || (month === 9 && day > 25)) {
      document.getElementById("file").textContent = "CASE CLOSED ♡";
      document.getElementById("heading").textContent =
        "The birthday investigation is complete. 🌻";
      document.getElementById("message").textContent =
        "The chaos, clues and affection were all filed for one very special human. Hope your birthday was beautiful, Khushi. 💌";
      document.getElementById("psst").textContent =
        "Until the next suspicious investigation… 👀";
    } else {
      document.getElementById("file").textContent = "CASE NOT YET OPEN";
      document.getElementById("heading").textContent =
        "A little mystery is on its way. 👀";
      document.getElementById("message").textContent =
        "Come back from October 19 for your first file. 🌻";
      document.getElementById("psst").textContent =
        "This investigation begins soon. 💌";
    }
  </script>
</body>
</html>
